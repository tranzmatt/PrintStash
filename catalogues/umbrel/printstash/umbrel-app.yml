manifestVersion: 1
id: printstash
storage:
  dataRoot: data
category: files
name: PrintStash
version: "0.15.1"
tagline: A self-hosted library for 3D models and the G-code that prints them
description: >-
  Sign in with the username and password Umbrel shows for this app, then choose
  where PrintStash stores your files. Both steps happen in the browser; nothing
  needs a terminal.


  PrintStash keeps your 3D models, sliced G-code revisions and print history in
  one searchable library on your own server.


  - Preview STL, 3MF, OBJ, STEP and G-code in the browser, with collections,
  tags, search and duplicate detection.

  - Attach several slices to one model, compare slicer settings, and mark the
  revisions that printed well.

  - Index an existing folder in place instead of copying it.

  - Send prints and follow jobs on Klipper/Moonraker, with beta support for
  OctoPrint, PrusaLink, Bambu Lab (LAN) and Elegoo printers.
releaseNotes: >-
  Version 0.15.1 adds multi-plate 3MF browsing, GLB/glTF, PLY, Rhino 3DM and FBX
  models, and 7z, RAR and TAR archive imports.


  Library and multipart workflows have clearer selection, filters and recovery.
  Similar-model analysis reuses results and verifies pairs in parallel within
  the configured CPU and memory budgets. Previews work again on older NAS kernels.


  Back up before upgrading. Stop all API and worker processes and upgrade them
  together. Changed recipes refresh metadata and previews in the background;
  Similar Models recomputes fingerprints on its next analysis. Rollback requires
  restoring the pre-upgrade backup.


  See https://github.com/xiao-villamor/PrintStash/blob/main/CHANGELOG.md#0151
  and https://github.com/xiao-villamor/PrintStash/blob/main/UPGRADE.md#0151-notes
  for the full notes and upgrade instructions.
developer: PrintStash contributors
website: https://www.printstash.org
dependencies: []
repo: https://github.com/xiao-villamor/PrintStash
support: https://github.com/xiao-villamor/PrintStash/issues
port: 3378
gallery: []
path: ""
# Umbrel generates a per-app password and shows both values on the app's page;
# docker-compose.yml passes them to VAULT_SETUP_ADMIN_*.
defaultUsername: "admin"
deterministicPassword: true
submitter: Jorge Hermo
submission: ""
